# Mirrors `make setup` + `make check` (fmt-check, clippy, test).
# Written for parity with local runs; runs on every push and pull request.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/bb-target
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/bb-target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Setup toolchain (make setup)
        run: make setup

      - name: Doctor
        run: make doctor

      - name: Format
        run: make fmt-check

      - name: Clippy
        run: make clippy

      # ADR-006 G1: every part.toml, pins.toml, test vector and bb.lock
      # against spec/schema, bb pkg lint, bb pkg test, current locks
      # (also part of make test).
      - name: Package schemas, lint and tests
        run: make packages

      - name: Test
        run: make test

  # ADR-004: `make test` runs on a warm Renode pool by default; this job
  # keeps the fresh path (one Renode per run) covered.
  fresh:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/bb-target
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/bb-target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Setup toolchain (make setup)
        run: make setup

      - name: Test, every Renode fresh (POOL=0)
        run: make test POOL=0

  # ADR-003 D1.2: the default cross-check is `--verify edges`; this job runs
  # the spike with the check after every grant and requires identical outputs.
  verify-every:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/bb-target
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/bb-target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Setup toolchain (make setup)
        run: make setup

      - name: Spike with --verify every
        run: make spike-verify-every

  # ADR-003 step 3: the spike at max_quantum 10 us ... 500 ms must give the
  # committed baseline nets.csv, nets.vcd and non-grant records byte for byte.
  partition:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/bb-target
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/bb-target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Setup toolchain (make setup)
        run: make setup

      - name: Partition equivalence
        run: make partition

  # ADR-003 step 4: 10 runs of the feedback board (examples/feedback) must be
  # byte-identical, and the acyclic variant (examples/feedback-open) must give
  # its committed one-cell reference hashes at every max_quantum.
  feedback:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/bb-target
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/bb-target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Setup toolchain (make setup)
        run: make setup

      - name: Feedback determinism (10 runs)
        run: make feedback-determinism

      - name: Feedback-open partition equivalence
        run: make feedback-open

      # ADR-003 step 5: the lookahead plugin is inert (no plugin = armed and
      # off, byte for byte; on changes only grant records).
      - name: Lookahead plugin inert
        run: make lookahead-inert

      # ADR-003 step 8: lookahead on (the default) at max_quantum 1 ms and
      # 10 ms gives the one-cell reference byte for byte (non-grant records),
      # for the WFI firmware (<= 200 grants) and a polling variant.
      - name: Lookahead equivalence
        run: make lookahead-equiv

  # ADR-003 step 9: adc_in on examples/adc (STM32F072). Part A (one cell),
  # Part B (lookahead, 1 ms and 10 ms) and the open board in long grants must
  # give the every-lattice-point references byte for byte (non-grant
  # records), and Renode's ADC model must behave as Amendment 5 pins it.
  adc:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/bb-target
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/bb-target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Setup toolchain (make setup)
        run: make setup

      - name: ADC equivalence (Part A, Part B, open board)
        run: make adc-equiv

      - name: Long one-cell reference across External Control reconnects
        run: make ec-long

      - name: Renode ADC platform test
        run: make adc-renode

  # Phase 1 M6 (plan section 2 E1): the dial-me-spinner LED rail sequencing gate. Both prebuilt
  # Zephyr firmwares at both benches, the one-cell references, both engine orders, the board-level
  # convergence gate, the PIN_CNF audit and its negative controls, 10-run determinism.
  dms-rail:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/bb-target
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/bb-target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Setup toolchain (make setup)
        run: make setup

      - name: E1 gate
        run: make dms-rail

      # Phase 1 M9 (ADR-008 D10, Amendment 7): `bb run --gdb` driven by gdb-multiarch (installed by
      # make setup) in batch mode on the spike and on E1. Attach without a stop is byte-identical to
      # the run without GDB; a breakpoint marks the run; scripted sessions repeat byte for byte;
      # holds, Ctrl-C, steps across grants, monitor refusal, kills, the loopback listener, the pool.
      - name: GDB passthrough gate
        run: make gdb

      # The docs site's committed waveform plots (site/public/plots) regenerated from fresh runs
      # (E1, E2 sag/rec/s50, the spike) must be byte-identical (about 1 min 45 s).
      - name: Docs plots up to date
        run: make docs-plots-check

  # ADR-008 D5: the committed E1 images rebuilt in a fresh west workspace (the pinned manifest,
  # Zephyr v4.5.0, SDK 1.0.1) must have the image hashes of firmware/prebuilt/SHA256SUMS.
  fw-rebuild:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/bb-target
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain and the Zephyr SDK (make setup SETUP=zephyr)
        run: make setup SETUP=zephyr

      - name: Rebuild the E1 firmware in a fresh workspace
        run: make fw-rebuild
