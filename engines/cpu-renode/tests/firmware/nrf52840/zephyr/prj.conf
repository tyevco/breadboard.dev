# nrf-zephyr gate image: GPIO and the kernel only. No console, UART or
# logging (a UART with a host backend would fail the lookahead self-test,
# and the gate observes pins only); no boot banner (ADR-008 D5).
CONFIG_GPIO=y
CONFIG_BOOT_BANNER=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
