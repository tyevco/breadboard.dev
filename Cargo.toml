[workspace]
resolver = "2"
members = [
    "bbcore",
    "bbpkg",
    "engines/analog-ngspice",
    "engines/cpu-renode",
    "importers/kicad",
    "cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.99"
publish = false

[workspace.dependencies]
bbcore = { path = "bbcore" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
