# examples/nrf-idd at pi with a bench-scheduled radio (ADR-009 D4: no firmware drives the radio
# states, so the bench schedules them and the report labels them): bench/pi.toml plus #radio_tx
# for 300 us every 1 ms from 0.5 ms (a 30 % TX duty; on the LDO IRADIO_TX3, 10.8 mA; ADR-009
# Amendment 12).
schema = "bb-bench/1"
fidelity = "pi"

[[supply]]
net = "VSUP"
volts = "3.0V"
rs = "10m"

[[activity]]
state = "main:U1#radio_tx"
at = "500us"
every = "1ms"
for = "300us"

# VDD is behind R1 (10 Ohm): its nominal level, for voh = "VDD" at fast (ADR-006 D4).
[nominal]
VDD = "3.0V"

[analog]
nets = ["GND", "VSUP", "VDD", "DRV", "SENSE", "COPY", "LED_B"]

[options]
set = "phase0"
