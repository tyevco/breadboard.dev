# The 1 kOhm contact closed at 1 ms and opened at 3 ms (ADR-010 gate G8): out charges from
# 32.673 mV towards 3.3 V x 1 Meg / 1.001 Meg = 3.296703 V with tau = (1 k || 1 Meg) x 1 uF =
# 0.999001 ms, then discharges through 1 Meg || 100 Meg (tau = 0.990 s).
schema = "bb-pkgtest/0"
view = "contact"
circuit = "contact.cir"
stop = "4ms"

[ports]
1 = "in"
2 = "out"
ctl = "ctl"

[[edge]]
net = "ctl"
model = { voh = "1V", vol = "0V", rise = "1ns", fall = "1ns", zout = "0" }
at = [["1ms", "high"], ["3ms", "low"]]

[[expect]]
meas = { node = "out", at = "0.5ms" }
value = "0.032673V"
tol = "5uV"
source = "analytic: open, 3.3 V x 1 Meg / (1 Meg + 100 Meg)"

[[expect]]
meas = { node = "out", at = "2ms" }
value = "2.097133V"
tol = "1mV"
source = "analytic: 3.296703 V + (32.673 mV - 3.296703 V) x exp(-(1 ms - 0.5 ns) / 0.999001 ms)"

[[expect]]
meas = { node = "out", when = "1.65V", rise = "1" }
value = "1.683504ms"
tol = "2us"
source = "analytic: 1 ms + 0.5 ns + tau x ln((3.296703 - 0.032673) / (3.296703 - 1.65))"

[[expect]]
meas = { node = "out", at = "3.5ms" }
value = "2.854422V"
tol = "1mV"
source = "analytic: opened at 3 ms + 0.5 ns from 2.855847 V, x exp(-0.5 ms / 0.990099 s) towards 32.673 mV"
