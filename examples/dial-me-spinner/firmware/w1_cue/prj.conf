# SPDX-License-Identifier: Apache-2.0
# GPIO, TIMER1 through the counter API (the blanking), POFCON through nrfx_power (its POFWARN
# handler runs from Zephyr's POWER_CLOCK interrupt), and printk on the UARTE0 console (the log
# lines of ADR-008 D8). No regulator framework: regulator_enable() sleeps off-on-delay-us inside
# the call (ADR-008 Amendment 3), and the blanking starts at the LED_PWR_EN edge. No logging
# subsystem and no boot banner (ADR-008 D5: no `git describe` in the image).
CONFIG_GPIO=y
CONFIG_COUNTER=y
CONFIG_NRFX_POWER=y
CONFIG_REGULATOR=n
CONFIG_BOOT_BANNER=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n
