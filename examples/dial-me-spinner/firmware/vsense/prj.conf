# SPDX-License-Identifier: Apache-2.0
# The SAADC, GPIO and the regulator framework, and printk on the UARTE0 console (the log lines of
# ADR-008 D8). No logging subsystem and no boot banner (ADR-008 D5: no `git describe` in the image).
CONFIG_ADC=y
CONFIG_GPIO=y
CONFIG_REGULATOR=y
CONFIG_BOOT_BANNER=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n
