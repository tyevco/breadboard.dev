# SPDX-License-Identifier: Apache-2.0
# E3 firmware: PWM0 through nrfx directly (dial-me-spinner docs/firmware.md section 3.4:
# "nrfx peripherals owned directly by the app"), the SAADC for the VSYS reading (E2's channel),
# GPIO for nSLEEP and HOME_N, and printk on the UARTE0 console (the log lines of ADR-008 D8).
# No logging subsystem and no boot banner (ADR-008 D5: no `git describe` in the image).
CONFIG_NRFX_PWM=y
CONFIG_ADC=y
CONFIG_GPIO=y
CONFIG_BOOT_BANNER=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n
