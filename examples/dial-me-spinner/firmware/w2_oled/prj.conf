# SPDX-License-Identifier: Apache-2.0
# GPIO, RESETREAS through the nrf_power HAL, and printk on the UARTE0 console (the log lines of
# ADR-008 D8). No regulator framework (the enables are plain GPIOs, as in W1), no logging
# subsystem and no boot banner (ADR-008 D5: no `git describe` in the image).
CONFIG_GPIO=y
CONFIG_REGULATOR=n
CONFIG_BOOT_BANNER=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n
