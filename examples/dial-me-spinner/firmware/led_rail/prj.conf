# GPIO and the regulator framework only. No console, UART or logging (the run observes pins), and
# no boot banner (ADR-008 D5: no `git describe` in the image).
CONFIG_GPIO=y
CONFIG_REGULATOR=y
CONFIG_BOOT_BANNER=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
