# examples/dial-me-spinner/asserts/e2/s50.toml: E2's reading codes (Phase 1 plan section 2 E2, ADR-008
# Amendments 4-6) as assertions (ADR-010 D5, D10; Amendment 3), for `bb run ... --assert` on the
# case s50 of scripts/dms_vsense.sh. Written by scripts/dms_asserts.py from check_dms_vsense.py's
# results on the committed runs; make assert-gate rewrites it from its own runs and requires this
# file byte for byte. Do not edit by hand.
schema = "bb-bench/1"
# Each reading's burst code: the code check_dms_vsense.py's model predicts from the unloaded pad and the run's acquisition instants (the suite's charge-sharing arithmetic).

[[assert]]
name = "E2-readings"
kind = "log"
source = "U10"
match = "^uart0: vsense: n="
min = 13
max = 13
msg = "the number of readings"

[[assert]]
name = "E2-code-n0"
kind = "log"
source = "U10"
match = "^uart0: vsense: n=0 "
field = "code"
min = 1067
max = 1067
msg = "reading 0's code"

