# examples/dial-me-spinner/bench/cold-pi.toml: the E1 cold bench at pi (Phase 2 milestone P2,
# ADR-009 D5).
#
# bench/cold.toml (the dial-me-spinner suite's bat3.0, -10 C corner; see there) run at pi, where
# every MCU digital_out drives from its rail: LED_DIN_MCU (P0.06) and LED_PWR_EN (P1.04) go high to
# +3V3 (VDD, nordic/nrf52840-qiaa's [power] io_rail) through their zout instead of to a fixed
# voh = 3.3 V, and are high-Z (100 MOhm) until the firmware makes them outputs (PIN_CNF.DIR). That
# removes E1's documented pessimism for LSW-3 (ADR-008 Amendment 3: voh was the bench's 3.3 V
# ceiling while the cold +3V3 is 2.956 V).
#
# Two differences from bench/cold.toml, both forced by pi:
#   - fidelity = "pi";
#   - U1 (richtek/rt9080, whose ldo view is pi only since milestone P1) is excluded: the +3V3
#     [[supply]] below is the suite's ideal LDO, which stands in for it as at fast. Without the
#     exclusion the two would drive +3V3 together (spec/project.md section 3: two drivers).
# Every other part keeps its fast view, which is also its pi view (TPS22917, WS2812C, generic R/C:
# valid and the default at fast and pi since P1), so the deck differs from bench/cold.toml's only
# in the digital_out glue.
schema = "bb-bench/1"
temp_c = "-10"
fidelity = "pi"

[[supply]]
net = "VSYS"
volts = "3.0V"
rs = "0.5692"

[[supply]]
net = "+3V3"
volts = "3.3V"
rs = "10m"
track = { net = "VSYS", drop = "44.167mV" }

[[load]]
net = "VSYS"
amps = "50mA"

[analog]
nets = [
  "GND", "VSYS", "+3V3", "VSYS_SENSE", "VLED", "LED_PWR_EN", "LSW_CT", "LSW_QOD",
  "LED_DIN_MCU", "LED_DIN_R", "LED_DIN",
  "LED_D1", "LED_D2", "LED_D3", "LED_D4", "LED_D5", "LED_D6", "LED_D7", "LED_D8",
  "LED_D9", "LED_D10", "LED_D11", "LED_D12", "LED_D13", "LED_D14", "LED_D15", "LED_D16",
  "LED_D17", "LED_D18", "LED_D19", "LED_D20", "LED_D21", "LED_D22", "LED_D23", "LED_D24",
  "LED_D25", "LED_D26", "LED_D27", "LED_D28", "LED_D29", "LED_D30", "LED_D31", "LED_D32",
  "LED_D33", "LED_D34", "LED_D35", "LED_D36", "LED_D37", "LED_D38", "LED_D39", "LED_D40",
  "LED_D41", "LED_D42", "LED_D43", "LED_D44", "LED_D45", "LED_D46", "LED_D47", "LED_D48",
]
exclude = ["main:U1"]

[options]
set = "phase0"
