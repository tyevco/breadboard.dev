# examples/dial-me-spinner/bench/sag.toml: the E2 battery-sag bench (Phase 1 plan section 2 E2, M8;
# ADR-007 D5).
#
# A battery whose open-circuit voltage ramps down through the low-battery LED shed of dial-me-spinner
# docs/firmware.md section 12.4 (VBAT_est = 0.979 x reading < 3.53 V, a reading below 3.6057 V):
#   VSYS: the OCV ramps linearly from 3.660 V at 0 s to 3.600 V at 6 s (10 mV/s), behind 0.3192 Ohm
#         (RPACK 0.25 + BAT-FET 0.055 + harness 0.0142, the E1 nominal bench's path; the plan's
#         0.2-0.4 Ohm), loaded by the 50 mA the suite draws for +3V3 (I3V3), as bench/nominal.toml;
#   +3V3: the suite's ideal LDO, min(3.3 V, V(VSYS) - 44.167 mV), as the E1 benches (3.3 V here).
# The LEDs come on at boot (VBAT_est 3.567 V) and are shed with E1's off sequence at the first reading
# after VSYS falls through about 3.606 V (near 3.8 s with 1 s readings). The OCV source is a [[pwl]]
# with rs (a voltage source behind the series resistor), not a Norton [[supply]]: a bench [[supply]]
# has a fixed or tracking voltage only.
# Not reproduced (plan section 2): the BQ25180 power path, the base-board VSYS capacitance, the
# cell's own dynamics (a linear OCV ramp stands in for the discharge), tolerances.
schema = "bb-bench/0"
temp_c = "25"

[[pwl]]
net = "VSYS"
points = [["0", "3.660V"], ["6s", "3.600V"]]
rs = "0.3192"

[[supply]]
net = "+3V3"
volts = "3.3V"
rs = "10m"
track = { net = "VSYS", drop = "44.167mV" }

[[load]]
net = "VSYS"
amps = "50mA"

[analog]
nets = [
  "GND", "VSYS", "+3V3", "VSYS_SENSE", "VLED", "LED_PWR_EN", "LSW_CT", "LSW_QOD",
  "LED_DIN_MCU", "LED_DIN_R", "LED_DIN",
  "LED_D1", "LED_D2", "LED_D3", "LED_D4", "LED_D5", "LED_D6", "LED_D7", "LED_D8",
  "LED_D9", "LED_D10", "LED_D11", "LED_D12", "LED_D13", "LED_D14", "LED_D15", "LED_D16",
  "LED_D17", "LED_D18", "LED_D19", "LED_D20", "LED_D21", "LED_D22", "LED_D23", "LED_D24",
  "LED_D25", "LED_D26", "LED_D27", "LED_D28", "LED_D29", "LED_D30", "LED_D31", "LED_D32",
  "LED_D33", "LED_D34", "LED_D35", "LED_D36", "LED_D37", "LED_D38", "LED_D39", "LED_D40",
  "LED_D41", "LED_D42", "LED_D43", "LED_D44", "LED_D45", "LED_D46", "LED_D47", "LED_D48",
]

[options]
set = "phase0"
