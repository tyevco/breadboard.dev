# examples/dial-me-spinner/w1/bench/w1-collapse.toml: W1 RAMPED STATIC LOAD at 60 mA, the COLLAPSE
# (REPORTED, not gated; approver decision D-close 5, 2026-11-17; ADR-009 Amendment 12). Everything but
# the static +3V3 load is bench/w1-stress.toml's (see its header for each element): RT9080
# worst_dropout, base U1 at worst_ilim100_min, the suite's averaged cue, POFWARN at V28 and VPOFTOL +5 %
# (2.94 V).
#
# The static +3V3 load (static-load mode, [[load]] replace = "main:U10") is RAMPED IN: a current
# profile (ramp-60mA.csv) at 0 A until 0.1 ms, linear to 60 mA at 0.2 ms, then held: after the
# operating point and 1 ms before the cue (LED_PWR_EN rises at 1.24 ms). With the load at its full
# value from t = 0 the deck's operating point fails at 40-48 and 59-62 mA (gmin, then source stepping;
# ADR-009 Amendment 11 item 2); ramped in, the operating point is solved without the load and the deck
# runs at every load from 30 to 65 mA. A profile load is a pure sink (spec/project.md section 3.2): it
# equals the `amps` form's (P1's knee at 0.5 V) wherever +3V3 stays above 0.5 V, which
# scripts/check_dms_w1_sweep.py gates on every run.
#
# make dms-w1 runs this bench as the REPORTED case `collapse` (the rule firmware: +3V3 falls below
# 2.94 V inside the 10 ms blanking and does not recover; the re-enable at the blanking's end raises
# POFWARN and sheds the cue) and, with the profile swapped for ramp-<L>mA.csv, W1's ramped load sweep
# (30 to 65 mA, among them 40-48 and 59-62 mA).
schema = "bb-bench/1"
temp_c = "25"
fidelity = "pi"
corner = "suite_compat"

[corners]
"main:U1" = "worst_dropout"
"base:U1" = "worst_ilim100_min"
"main:U10" = "max"

[[battery]]
net = "base:VBAT"
ocv = "cell-dead.csv"
soc = "0.5"
r0 = "0.25"
temp_c = "25"

[[supply]]
net = "base:VBUS"
volts = "5.0V"
rs = "10m"

# W1 RAMPED STATIC LOAD: 0 A until 0.1 ms, then linear to 60 mA at 0.2 ms (suite budget 50 mA).
[[load]]
net = "+3V3"
profile = "ramp-60mA.csv"
interp = "linear"
replace = "main:U10"

[analog]
nets = [
  "main:GND", "main:VSYS", "+3V3", "VSYS_SENSE", "VLED", "LED_PWR_EN", "LSW_CT", "LSW_QOD",
  "LED_DIN_MCU", "LED_DIN_R", "LED_DIN",
  "LED_D1", "LED_D2", "LED_D3", "LED_D4", "LED_D5", "LED_D6", "LED_D7", "LED_D8",
  "LED_D9", "LED_D10", "LED_D11", "LED_D12", "LED_D13", "LED_D14", "LED_D15", "LED_D16",
  "LED_D17", "LED_D18", "LED_D19", "LED_D20", "LED_D21", "LED_D22", "LED_D23", "LED_D24",
  "LED_D25", "LED_D26", "LED_D27", "LED_D28", "LED_D29", "LED_D30", "LED_D31", "LED_D32",
  "LED_D33", "LED_D34", "LED_D35", "LED_D36", "LED_D37", "LED_D38", "LED_D39", "LED_D40",
  "LED_D41", "LED_D42", "LED_D43", "LED_D44", "LED_D45", "LED_D46", "LED_D47", "LED_D48",
  "main:VBUS", "main:I2C_SCL", "main:I2C_SDA", "main:CHG_INT_N",
  "base:GND", "base:VSYS", "base:VBAT", "base:VBUS", "base:/Base board/I2C_SCL",
  "base:/Base board/I2C_SDA", "base:/Base board/CHG_INT_N", "CHG_TSMR",
]

# The pins voh = VDD names resolve to +3V3 (unused at pi, where an output drives from its rail;
# ADR-009 D5).
[nominal]
"+3V3" = "3.3V"

[options]
set = "phase0"
