# examples/dial-me-spinner/bb.toml: the Phase 1 reference board as a
# Breadboard project (ADR-007 D5, spec/project.md).
#
# The main board is imported from the netlist vendored at dial-me-spinner
# 6854d25 (KiCad 10.0.8; SOURCE), so `bb open` needs no KiCad. With KiCad 9
# or 10 installed, `kicad = "kicad/main/dial-me-spinner-main.kicad_pro"`
# gives the same board.bbm (gate M4c, `make kicad-import`).
#
# E1 (Phase 1 plan section 2, M6): U10 (the Raytac module; its chip, the
# nRF52840, runs firmware/prebuilt/led_rail.elf on Renode) drives LED_PWR_EN
# (P1.04, the ON pin of U2, the TPS22917 VLED load switch) and LED_DIN_MCU
# (P0.06, through R40 into the LED ring's data input). The benches are in
# bench/. The base board and the harness ([[connection]]) are M11.
schema = "bb-project/0"

[project]
name = "dial-me-spinner rev A"
simulate = "main"

[[board]]
id = "main"
netlist = "kicad/main/dial-me-spinner-main.net"
ground = "GND"

# J11 is two solder pads for the NFC coil's flex tail: no MPN, no LCSC and
# no generic footprint, so resolution needs a decision (ADR-007 D4).
[instances."main:J11"]
package = "none"
reason = "NFC coil pads: no RF model in Phase 1"

# Written by `bb flash --target U10 firmware/prebuilt/led_rail.elf` (the hash
# is the ELF image hash of ADR-008 D5); the demo flashes
# firmware/prebuilt/led_rail_wrong_order.elf the same way.
[targets."main:U10"]
images = [{ file = "firmware/prebuilt/led_rail.elf", kind = "elf", hash = "sha256:5b02dd56447b14534702aea8be288577569f21a41c029d74b179fe6f450bbc10" }]

# LED_PWR_EN: a plain GPIO output (dial-me-spinner docs/firmware.md section 1.3), so
# PIN_CNF's reset drive, S0S1 (200 Ohm at the PS's 2 mA column).
[[bind]]
pin = "main:U10.P1.04"
model = "digital_out"
set = "S0S1"
net = "LED_PWR_EN"

# LED_DIN_MCU: high drive is required (firmware.md section 1.3); the suite's E1
# decks use the strongest pad of the PS's H0H1 column (28.6 Ohm, ADR-006
# Amendment 3 item 5a), the worst case for DIN over VLED.
[[bind]]
pin = "main:U10.P0.06"
model = "digital_out"
set = "H0H1_max"
net = "LED_DIN_MCU"

# E2 (Phase 1 plan section 2 E2, M8; ADR-008 D7): VSYS_SENSE (R1 2.2 MOhm over R2 1 MOhm, C5 100 nF)
# on AIN0 = P0.02, read by firmware/prebuilt/vsense.elf through Breadboard's SAADC. The package's
# adc_in set (nordic/nrf52840-qiaa): the loading input, pin_load view saadc_se (CPAD 3 pF, CS 2.5 pF
# pre-charged to VPRE = VDD at every acquisition, one charge transfer per acquisition). Every sample
# is a debug log record (the analog-side observable of E2). The E1 firmware never starts the SAADC,
# so these two bindings load VSYS_SENSE (CPAD + CS) and nothing else in E1.
[[bind]]
pin = "main:U10.P0.02"
model = "adc_in"
net = "VSYS_SENSE"
trace_samples = true

# The SAADC's VDD input (PSELP = VDD, REFSEL = VDD1_4) and saadc_se's VPRE: +3V3 on U10's VDD pad.
# vref is the clamp of the pushed value.
[[bind]]
pin = "main:U10.VDD"
model = "adc_in"
vref = "3.6V"

[probes]
nets = ["VLED", "LED_DIN", "LED_DIN_MCU", "LED_DIN_R", "VSYS"]
