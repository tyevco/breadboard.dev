# dial-me-spinner/detent-stepper pins: J40's (KiCad Conn_01x04_MountingPin, footprint
# JST_SH_SM04B-SRSS-TB_1x04-1MP): Pin_1/Pin_2 phase A (MOT_A_OUT1, MOT_A_OUT2), Pin_3/Pin_4 phase B
# (MOT_B_OUT1, MOT_B_OUT2), MP the mounting pin (on GND, no conductor of the motor).
schema = "bb-pins/0"

[[pin]]
number = "1"
name = "Pin_1"
role = "passive"

[[pin]]
number = "2"
name = "Pin_2"
role = "passive"

[[pin]]
number = "3"
name = "Pin_3"
role = "passive"

[[pin]]
number = "4"
name = "Pin_4"
role = "passive"

[[pin]]
number = "MP"
name = "MountPin"
role = "passive"
