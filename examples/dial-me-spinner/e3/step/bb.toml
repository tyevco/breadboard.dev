# examples/dial-me-spinner/e3/step/bb.toml: E3's step case as a project (Phase 2 R1, ADR-013 D1): the
# project route of ../board-step.cir (scripts/dms_home_boards.py): homing_step.elf, one full step at
# 446 PPS mid-stroke (M1 from s0 = 400 steps) through U40 and U41 (ti/drv8837) into the motor's two
# phases on J40, with the suite's back-EMF over the step (dial-me-spinner/detent-stepper, view
# step_emf). Everything else is ../home's (see its bb.toml): the imported main board, U10 by pad, M1
# a virtual device, U42 inside it. The bench (bench.toml) keeps the MOT nets and the bridges' outputs
# in [analog] nets, so the power stage is in the deck, as in ../board-step.cir.
schema = "bb-project/1"

[project]
name = "dial-me-spinner rev A: E3 step (one full step at 446 PPS)"

[[board]]
id = "main"
netlist = "../../kicad/main/dial-me-spinner-main.net"
ground = "GND"

# dial-me-spinner/detent-stepper (J40's motor).
[packages]
paths = ["../packages"]

# As in ../../bb.toml: the NFC coil pads need a decision (ADR-007 D4).
[instances."main:J11"]
package = "none"
reason = "NFC coil pads: no RF model in Phase 1"

[instances."main:U42"]
package = "none"
reason = "the DRV5032FA home switch is part of the virtual device M1 (dms/detent-mechanism), which drives HOME_N"

# The motor with the suite's back-EMF over homing_step.elf's step (the view's default window).
[instances."main:J40"]
package = "dial-me-spinner/detent-stepper"
analog = "step_emf"

# Written by `bb flash --project e3/step --target U10 ../../firmware/prebuilt/homing_step.elf` (the image
# hash of ADR-008 D5).
[targets."main:U10"]
images = [{ file = "../../firmware/prebuilt/homing_step.elf", kind = "elf", hash = "sha256:9479106af6285dae06a4f1c5b40d5c265f6235e78d73602a5ced851df738dbb3" }]

# The four PWM0 channels and nSLEEP: plain GPIO outputs at the suite's S0S1 bound (800 Ohm), 3.3 V
# (../board.cir's *bb pin lines; the PWM model's edges at their exact instants, ADR-008 D9).
[[bind]]
pin = "main:U10.P0.26"
model = "digital_out"
set = "S0S1_bound"
voh = "3.3V"
net = "MOT_A_IN1"

[[bind]]
pin = "main:U10.P0.05"
model = "digital_out"
set = "S0S1_bound"
voh = "3.3V"
net = "MOT_A_IN2"

[[bind]]
pin = "main:U10.P0.07"
model = "digital_out"
set = "S0S1_bound"
voh = "3.3V"
net = "MOT_B_IN1"

[[bind]]
pin = "main:U10.P0.11"
model = "digital_out"
set = "S0S1_bound"
voh = "3.3V"
net = "MOT_B_IN2"

[[bind]]
pin = "main:U10.P1.15"
model = "digital_out"
set = "S0S1_bound"
voh = "3.3V"
net = "MOT_NSLEEP"

# HOME_N reads M1.HOME_N directly (spec/package.md section 12); the thresholds are the board file's.
[[bind]]
pin = "main:U10.P1.14"
model = "digital_in"
vih = "2.31V"
vil = "0.99V"
net = "HOME_N"

# The VSYS reading (an ideal input: the firmware reads VSYS once at idle, before H0; ../board.cir) and
# the SAADC's VDD input.
[[bind]]
pin = "main:U10.P0.02"
model = "adc_in"
vref = "3.6V"
load = "none"
net = "VSYS_SENSE"

[[bind]]
pin = "main:U10.VDD"
model = "adc_in"
vref = "3.6V"

# M1: the lead screw, carriage, magnet and U42 DRV5032FA as one device (dms/mechanism@1), mid-stroke
# (s0 = 400 steps) at the typical tS, as in ../board-step.cir. Its reference is M1, so its seeded
# sample phase is the same.
[[device]]
ref = "main:M1"
package = "dms/detent-mechanism"
virtual = true
params = { s0 = "400", ts = "50ms" }

[[device.bind]]
pin = "IN_A1"
net = "MOT_A_IN1"
model = "digital_in"

[[device.bind]]
pin = "IN_A2"
net = "MOT_A_IN2"
model = "digital_in"

[[device.bind]]
pin = "IN_B1"
net = "MOT_B_IN1"
model = "digital_in"

[[device.bind]]
pin = "IN_B2"
net = "MOT_B_IN2"
model = "digital_in"

[[device.bind]]
pin = "NSLEEP"
net = "MOT_NSLEEP"
model = "digital_in"

[[device.bind]]
pin = "HOME_N"
net = "HOME_N"
model = "digital_out"

# ../board-step.cir's probes (scripts/dms_home.sh) that are nets of the board: not COILA_L and
# COILB_L (nodes inside J40's view) nor NB_VBAT and NB_VSYS (the base board's, R2). The bridges'
# outputs are named by their leaf (the display name is "/Detent actuator & home sensor/MOT_A_OUT1").
[probes]
nets = ["VSYS", "HOME_N", "MOT_NSLEEP", "U10.P0.26", "U10.P0.05", "U10.P0.07", "U10.P0.11", "U10.P1.15",
        "M1.HOME_N", "MOT_A_OUT1", "MOT_B_OUT1"]
