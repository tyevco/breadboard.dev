# examples/dial-me-spinner/w2/bench/w2-rule.toml: W2's RULE case in static-load mode (Phase 2 P5; plan
# section 2 W2; ADR-009 D4, D7, Amendment 9).
#
# The dial-me-spinner suite's test_u21_turn_on_dead_battery_usb_100ma_with_fw_rule[ILIM100-SYSREG4.5]
# (hardware/sim/tests at 6854d25; +3V3 min 3.2224 V, VSYS min 3.2666 V, OLED_VIN held off) on the
# system's pi views, with the rule firmware (w2_rule.elf: NEW-1, the OLED stays off) in the loop: only
# the LED charging cue runs (LED_PWR_EN, then P0.06 15 ms later), at the suite's averaged cue (the
# WS2812C view's corner suite_compat). Otherwise as w2-old.toml (its header lists the corners, the
# supply, the dead cell and the 50 mA static load).
schema = "bb-bench/1"
temp_c = "25"
fidelity = "pi"
corner = "suite_compat"

[corners]
"main:U1" = "worst_dropout"
"base:U1" = "worst_ilim100"
"main:U10" = "typ"

[[battery]]
net = "base:VBAT"
ocv = "cell-dead.csv"
soc = "0.5"
r0 = "0.25"
temp_c = "25"

[[supply]]
net = "base:VBUS"
volts = "5.0V"
rs = "10m"

# Static-load mode: the suite's 50 mA +3V3 budget.
[[load]]
net = "+3V3"
amps = "50mA"
replace = "main:U10"

[analog]
nets = [
  "main:GND", "main:VSYS", "+3V3", "VSYS_SENSE", "VLED", "LED_PWR_EN", "LSW_CT", "LSW_QOD",
  "LED_DIN_MCU", "LED_DIN_R", "LED_DIN",
  "LED_D1", "LED_D2", "LED_D3", "LED_D4", "LED_D5", "LED_D6", "LED_D7", "LED_D8",
  "LED_D9", "LED_D10", "LED_D11", "LED_D12", "LED_D13", "LED_D14", "LED_D15", "LED_D16",
  "LED_D17", "LED_D18", "LED_D19", "LED_D20", "LED_D21", "LED_D22", "LED_D23", "LED_D24",
  "LED_D25", "LED_D26", "LED_D27", "LED_D28", "LED_D29", "LED_D30", "LED_D31", "LED_D32",
  "LED_D33", "LED_D34", "LED_D35", "LED_D36", "LED_D37", "LED_D38", "LED_D39", "LED_D40",
  "LED_D41", "LED_D42", "LED_D43", "LED_D44", "LED_D45", "LED_D46", "LED_D47", "LED_D48",
  "OLED_VIN", "OLED_VCC_EN", "+13V_OLED",
  "main:/OLED display & 13 V boost/OLED_BST_SW", "main:/OLED display & 13 V boost/OLED_BST_FB",
  "main:/OLED display & 13 V boost/OLED_LSW_CT",
  "main:VBUS", "main:I2C_SCL", "main:I2C_SDA", "main:CHG_INT_N",
  "base:GND", "base:VSYS", "base:VBAT", "base:VBUS", "base:/Base board/I2C_SCL",
  "base:/Base board/I2C_SDA", "base:/Base board/CHG_INT_N", "CHG_TSMR",
]

[nominal]
"+3V3" = "3.3V"

[options]
set = "phase0"
