# nordic/nrf52840-qiaa idd (supply_load, ADR-009 D4, Phase 2 P3): each state adds its [power] idd typ,
# in the part's default supply mode, the LDO (ADR-009 Amendment 12, decision D-close 3; idd_states_dcdc
# is the same circuit in mode dcdc). VDD from 3.0 V through 20 Ohm; the states rise one by one, 0 V /
# 1 V with 1 ns edges like the glue's state sources. Expected V(vdd) = 3 V - 20 Ohm * (2.35 uA + the
# sum of the states' typ currents so far), by hand: 6.072 mA run (ICPU1 6.3 mA less 0.228 mA), 0.228 mA
# hfxo (ITIMER2 - ITIMER0), 1.24 mA saadc (ISAADC,RUN: no LDO figure), 10.8 mA radio_tx (IRADIO_TX3),
# 10.1 mA radio_rx (IRADIO_RX1) (PS v1.1 section 5.2 figures in part.toml).
schema = "bb-pkgtest/0"
view = "idd"
circuit = "idd_supply.cir"
stop = "120us"

[ports]
VDD = "vdd"
VSS = "0"
run = "run"
hfxo = "hfxo"
saadc = "saadc"
radio_tx = "radio_tx"
radio_rx = "radio_rx"

[[edge]]
net = "run"
model = { voh = "1V", vol = "0V", rise = "1ns", fall = "1ns", zout = "0" }
initial = "low"
at = [["20us", "high"]]

[[edge]]
net = "hfxo"
model = { voh = "1V", vol = "0V", rise = "1ns", fall = "1ns", zout = "0" }
initial = "low"
at = [["40us", "high"]]

[[edge]]
net = "saadc"
model = { voh = "1V", vol = "0V", rise = "1ns", fall = "1ns", zout = "0" }
initial = "low"
at = [["60us", "high"]]

[[edge]]
net = "radio_tx"
model = { voh = "1V", vol = "0V", rise = "1ns", fall = "1ns", zout = "0" }
initial = "low"
at = [["80us", "high"]]

[[edge]]
net = "radio_rx"
model = { voh = "1V", vol = "0V", rise = "1ns", fall = "1ns", zout = "0" }
initial = "low"
at = [["100us", "high"]]

[[expect]]
meas = { node = "vdd", at = "10us" }
value = "2.999953V"
tol = "1uV"
source = "hand calculation: 3 V - 20 Ohm * 2.35 uA (ibase, ION_RAMON_EVENT)"

[[expect]]
meas = { node = "vdd", at = "30us" }
value = "2.878513V"
tol = "1uV"
source = "hand calculation: 3 V - 20 Ohm * (2.35 uA + 6.072 mA)"

[[expect]]
meas = { node = "vdd", at = "50us" }
value = "2.873953V"
tol = "1uV"
source = "hand calculation: 3 V - 20 Ohm * (2.35 uA + 6.072 + 0.228 mA)"

[[expect]]
meas = { node = "vdd", at = "70us" }
value = "2.849153V"
tol = "1uV"
source = "hand calculation: 3 V - 20 Ohm * (2.35 uA + 6.072 + 0.228 + 1.24 mA)"

[[expect]]
meas = { node = "vdd", at = "90us" }
value = "2.633153V"
tol = "1uV"
source = "hand calculation: 3 V - 20 Ohm * (2.35 uA + 6.072 + 0.228 + 1.24 + 10.8 mA)"

[[expect]]
meas = { node = "vdd", at = "110us" }
value = "2.431153V"
tol = "1uV"
source = "hand calculation: 3 V - 20 Ohm * (2.35 uA + 6.072 + 0.228 + 1.24 + 10.8 + 10.1 mA)"
