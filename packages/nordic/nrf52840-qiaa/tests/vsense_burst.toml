# nordic/nrf52840-qiaa saadc_se (pin_load, ADR-008 D7): one 8x burst (TACQ 40 us + tCONV 2 us) on the dial-me-spinner VSYS divider at the suite's worst case
# One #smp edge per acquisition (alternating levels, as the CPU engine's toggle), 0 V / 1 V with 1 ns
# edges like glue rule 9's source. Expected: one charge transfer per edge, V' = (Cp V + CS VPRE) / (Cp + CS)
# with Cp = C5 100 nF + CPAD 3 pF and CS 2.5 pF, and between edges the pad (with CS through RSW) relaxing to
# 0.9375 V with tau = 68.75 ms; computed in closed form (ADR-008 Amendment 5).
schema = "bb-pkgtest/0"
view = "saadc_se"
circuit = "vsense_burst.cir"
stop = "360us"

[ports]
pad = "pad"
smp = "smp"
hold = "hold"
VDD = "vdd"

[[edge]]
net = "smp"
model = { voh = "1V", vol = "0V", rise = "1ns", fall = "1ns", zout = "0" }
initial = "low"
at = [["20us", "high"], ["62us", "low"], ["104us", "high"], ["146us", "low"], ["188us", "high"], ["230us", "low"], ["272us", "high"], ["314us", "low"]]

[[expect]]
meas = { node = "hold", at = "60us" }
value = "0.937561V"
tol = "3uV"
source = "closed form, CS 2.5 pF, CPAD 3 pF, C5 100 nF, R1 || R2 687.5 kOhm, VPRE = VDD = 3.366 V after 1 transfer"

[[expect]]
meas = { node = "hold", at = "100us" }
value = "0.937621V"
tol = "3uV"
source = "closed form, CS 2.5 pF, CPAD 3 pF, C5 100 nF, R1 || R2 687.5 kOhm, VPRE = VDD = 3.366 V after 2 transfers"

