# nordic/nrf52840-qiaa idd (supply_load, ADR-009 D4, Phase 2 P3): pscale = 1, the constant-power option
# (off by default, unverified): I = (2.35 uA + 3.1 mA) * 3 V / V(vdd) with #run high. VDD from 2.0 V
# through 10 Ohm: V = 2 - 10 * 3.10235e-3 * 3 / V, so V = (2 + sqrt(4 - 4 * 0.0930705)) / 2 = 1.95232846 V by hand.
schema = "bb-pkgtest/0"
view = "idd"
circuit = "idd_mid.cir"
stop = "40us"

[params]
pscale = "1"

[ports]
VDD = "vdd"
VSS = "0"
run = "run"
hfxo = "hfxo"
saadc = "saadc"
radio_tx = "radio_tx"
radio_rx = "radio_rx"

[[edge]]
net = "run"
model = { voh = "1V", vol = "0V", rise = "1ns", fall = "1ns", zout = "0" }
initial = "low"
at = [["5us", "high"]]

[[expect]]
meas = { node = "vdd", at = "30us" }
value = "1.952328V"
tol = "1uV"
source = "hand calculation: V = (2 + sqrt(4 - 4 * 10 * 3.10235e-3 * 3)) / 2 V"
