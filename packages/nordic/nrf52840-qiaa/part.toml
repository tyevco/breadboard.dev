options = "phase0"

[[analog]]
name = "pof"
kind = "pof_comparator"
purpose = "the power supply supervisor at pi: the power-fail comparator (ADR-009 D6), #pofwarn = V(VDD) below VPOF = POFCON.THRESHOLD's voltage x (1 + VPOFTOL), released at VPOF + VPOFHYST; and the brownout reset detector (ADR-009 D7), #bor = V(VDD) below VBOR,ON, released at VBOR,ON + bhyst"
fidelity = ["pi"]
file = "analog/pof.lib"
subckt = "NORDIC_NRF52840_QIAA_POF"
ports = [{ role = "pin", pin = "VDD" }, { role = "pin", pin = "VSS" }, { role = "state", state = "pofthr0" }, { role = "state", state = "pofthr1" }, { role = "state", state = "pofthr2" }, { role = "state", state = "pofthr3" }, { role = "observe", signal = "pofwarn" }, { role = "observe", signal = "bor" }]
params = { tol = "0", hyst = "50mV", vbor = "1.6V", bhyst = "10mV" }
rails = ["VDD"]

[[analog.corners]]
name = "typ"
params = { tol = "0", vbor = "1.6V" }
