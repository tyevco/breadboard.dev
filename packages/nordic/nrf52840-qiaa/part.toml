[[analog.corners]]
name = "min"
params = { tol = "-0.05", vbor = "1.57V" }
ref = "nRF52840 PS v1.1 section 5.3.8.4: VPOFTOL -5 % (V28: 2.66 V), the comparator that trips latest; VBOR,ON min 1.57 V, the detector that trips latest"

[[analog.corners]]
