not_modelled = ["flash write and erase current (the PS gives none; #nvmc has no idd entry)", "peripherals other than the CPU, HFXO, the SAADC and the radio (TIMERs, RTC, UARTE, GPIOTE, TEMP, PWM)", "start-up currents (HFXO ISTART, the radio ramp-up)", "temperature dependence"]
generated_by = "Claude (Phase 2 milestone P3)"
confidence = "datasheet_checked"

[[analog.qualified]]   # bb pkg test --record
