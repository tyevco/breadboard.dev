# nordic/nrf52840-qiaa: the Nordic nRF52840 SoC, aQFN73 (Phase 1 plan M5, ADR-006 D9, ADR-008 D1-D2).
#
# The behavioural layer is Breadboard's Renode platform nrf52840-bb@4 (ADR-008 D1: Renode 1.17.0's
# nRF52840 without the SVD download, 64 MIPS). The pins carry the GPIO pin models resolved against the
# PS (pins.toml says how). The suite's GPIO "views" (ADR-006 D9's gpio_led, gpio_lsw, ...) are pad
# DRIVERS: in a co-simulation the pad's driver is the pin model, so a circuit view of it would put a
# second driver on the net (the pin-boundary contract allows one). They become pins.toml's named
# parameter sets instead, and the package has no circuit view (ADR-006 Amendment 3). Its one analog
# view is the SAADC's pin_load view saadc_se (plan M8, ADR-008 D7), the load a bound adc_in puts on
# its pad; the behavioural platform nrf52840-bb@4 has the SAADC model it feeds. Since Phase 2 P4 (ADR-009
# D6) the platform also has Breadboard's POWER model (BbNrf52Power), and the package the power-fail
# comparator `pof` it reads at pi; since P5 (ADR-009 D7) the same view's brownout reset detector,
# whose output the CPU engine holds the machine in reset by.
schema = "bb-part/1"

[part]
id = "nordic/nrf52840-qiaa"
version = "0.6.0"
kind = "soc"
manufacturer = "Nordic Semiconductor"
mpn = ["NRF52840-QIAA", "NRF52840-QIAA-R", "NRF52840-QIAA-R7"]
datasheet = { url = "https://docs.nordicsemi.com/bundle/ps_nrf52840/page/keyfeatures_html5.html", rev = "PS v1.1 (4413_417, 2019-02-28)" }
license = "Apache-2.0"
description = "Bluetooth LE SoC, Arm Cortex-M4F 64 MHz, 1 MB flash, 256 kB RAM, USB, aQFN73"

[footprints]
kicad = ["Package_DFN_QFN:Nordic_AQFN-73-1EP_7x7mm_P0.5mm"]

[pins]
file = "pins.toml"

[behavioral]
engine = "renode"
platform = "nrf52840-bb@4"

# ADR-009 D5 (milestone P2): at pi a digital_out drives from VDD, the GPIO supply (PS v1.1 section
# 6.9.3.1: VOH and IOH are given against VDD).
#
# ADR-009 D4 (milestone P3): the supply current per CPU state, which the supply_load view `idd`
# draws at pi (I = ibase + sum of the states' typ currents). PS v1.1 section 5.2 gives scenario
# currents from VDD at 3 V, 25 degC; the CPU figures are CoreMark from flash. The PS gives typical
# values only, so no max is stated. Scenario figures include their own clock and regulator base
# currents, so concurrent states sum those twice (at most HFXO's 0.2-0.23 mA). The PS gives no flash
# write or erase current, so the CPU engine's #nvmc output has no idd entry here (ADR-009 Amendment 6).
#
# The regulator (ADR-009 Amendment 12, approver decision D-close 3): the figures depend on whether VDD
# feeds the core through the LDO or the DC/DC, so they are given per supply MODE. `ldo` is the first
# and the default: the part's reset state (POWER.DCDCEN = 0; PS v1.1 section 5.3.1.1), and what every
# committed firmware runs on (Zephyr v4.5.0's nrf52840.dtsi sets reg1 to NRF5X_REG_MODE_LDO; no board
# of this repository overrides it). A project selects `dcdc` with [instances."<ref>"] power_mode =
# "dcdc", and the nRF52840's CPU engine fails the run when the firmware's POWER.DCDCEN disagrees with
# the mode. The PS's scenario table (5.2, "common conditions") is at the LDO unless a row says
# "Regulator = DC/DC".
[power]
io_rail = "VDD"
vdd_min = "1.7V"   # PS v1.1 section 5.3.8.1 (VDD, normal voltage mode operating voltage, min 1.7 V)
modes = ["ldo", "dcdc"]

[power.idd.run]
typ = "6.072mA"
ref = "nRF52840 PS v1.1 section 5.2.1.3 ICPU1 (6.3 mA: CPU running CoreMark @64 MHz from flash, Clock = HFXO, the LDO) less hfxo's LDO figure (0.228 mA, below): the PS gives no LDO figure on HFINT, and run + hfxo = ICPU1 for an awake CPU on HFXO"

[power.idd.run.dcdc]
typ = "3.1mA"
ref = "nRF52840 PS v1.1 section 5.2.1.3 ICPU4: CPU running CoreMark @64 MHz from flash, Clock = HFINT, Regulator = DC/DC"

[power.idd.hfxo]
typ = "0.228mA"
ref = "nRF52840 PS v1.1 section 5.2.1.9 ITIMER2 - ITIMER0 (646 - 418 uA): one TIMER on HFXO against HFINT, at the scenario table's common regulator, the LDO"

[power.idd.hfxo.dcdc]
typ = "0.2mA"
ref = "nRF52840 PS v1.1 section 5.2.1.3 ICPU0 - ICPU4 (3.3 - 3.1 mA): the same CPU scenario on HFXO against HFINT, Regulator = DC/DC"

[power.idd.saadc]
typ = "1.24mA"
ref = "nRF52840 PS v1.1 section 5.2.1.7 ISAADC,RUN (SAADC sampling @ 16 ksps, Acquisition time = 20 us, Clock = HFXO, Regulator = DC/DC): the PS gives no LDO figure, so the DC/DC figure stands in (a lower bound on the LDO; ADR-009 Amendment 12)"

[power.idd.saadc.dcdc]
typ = "1.24mA"
ref = "nRF52840 PS v1.1 section 5.2.1.7 ISAADC,RUN: SAADC sampling @ 16 ksps, Acquisition time = 20 us, Clock = HFXO, Regulator = DC/DC"

[power.idd.radio_tx]
typ = "10.8mA"
ref = "nRF52840 PS v1.1 section 5.2.1.5 IRADIO_TX3: Radio transmitting @ 0 dBm output power, 1 Mbps BLE mode, Clock = HFXO (the LDO)"

[power.idd.radio_tx.dcdc]
typ = "6.4mA"
ref = "nRF52840 PS v1.1 section 5.2.1.5 IRADIO_TX1: Radio transmitting @ 0 dBm output power, 1 Mbps BLE mode, Clock = HFXO, Regulator = DC/DC"

[power.idd.radio_rx]
typ = "10.1mA"
ref = "nRF52840 PS v1.1 section 5.2.1.5 IRADIO_RX1: Radio receiving @ 1 Mbps BLE mode, Clock = HFXO (the LDO)"

[power.idd.radio_rx.dcdc]
typ = "6.26mA"
ref = "nRF52840 PS v1.1 section 5.2.1.5 IRADIO_RX0: Radio receiving @ 1 Mbps BLE mode, Clock = HFXO, Regulator = DC/DC"

[provenance]
source = "datasheet"
refs = ["nRF52840 PS v1.1 section 6.9.3.1 (GPIO electrical specification)", "nRF52840 PS v1.1 section 7 (pin assignments, aQFN73)"]
not_modelled = ["the GPIO pad's ESD clamps and its I-V beyond the 0.4 V point", "internal pull resistors"]
confidence = "datasheet_checked"

[[analog]]
name = "saadc_se"
kind = "pin_load"
purpose = "SAADC single-ended input (ADR-008 D7): pad capacitance, and the sample capacitor pre-charged to VPRE and charged from the pad once per acquisition"
fidelity = ["fast"]
default_for = ["fast"]
file = "analog/saadc_se.lib"
subckt = "NORDIC_NRF52840_QIAA_SAADC_SE"
ports = [{ role = "pad" }, { role = "ctrl", signal = "smp" }, { role = "observe", signal = "hold" }, { role = "pin", pin = "VDD" }]
params = { cs = "2.5p", cpad = "3p", rsw = "5k", tpre = "20n", rpre = "100", vpre_vdd = "1" }

[analog.provenance]
source = "agent_generated"
base = "breadboard.dev's own view of ADR-008 D7 (one charge transfer per acquisition, the pre-charge inside the view), with the dial-me-spinner suite's SAADC constants"
refs = [
  "CS 2.5 pF, CPAD 3 pF, RSW 5 kOhm (assumed, checked by the suite against the PS acquisition-time table), VPRE before every acquisition: dial-me-spinner@6854d25:hardware/sim/models/vsys_sense__nrf52840_saadc.lib, from nRF52840 PS v1.1 section 6.23",
  "VPRE = VDD (the suite's worst case): ADR-008 approver decision A6",
]
deviations = [
  "CS stays connected to the pad through RSW between acquisitions (silicon opens the switch): 2.5 pF more on the pad (ADR-008 D7)",
  "the pre-charge lasts about tpre * ln 2 = 14 ns after each #smp edge through rpre, inside a 24 ns window with the sample switch open (the PS does not say how CS is reset)",
]
not_modelled = ["the input resistor ladders RESP/RESN", "differential mode (PSELN)", "gain and offset errors", "the input's leakage"]
generated_by = "Claude (Phase 1 M8)"
confidence = "self_checked"   # tests/: the charge sharing against its closed form (ADR-008 Amendment 5)

[[analog.qualified]]   # bb pkg test --record
lattice = "10us"
options = "phase0"

[[analog]]
name = "idd"
kind = "supply_load"
purpose = "the SoC's VDD current per CPU state at pi (ADR-009 D4): I = (ibase + sum of s_k * [power] idd.<k>.typ in the run's supply mode, the LDO or the DC/DC; ADR-009 Amendment 12), collapsing linearly below vdd_min"
fidelity = ["pi"]
file = "analog/idd.lib"
subckt = "NORDIC_NRF52840_QIAA_IDD"
ports = [{ role = "pin", pin = "VDD" }, { role = "pin", pin = "VSS" }, { role = "state", state = "run" }, { role = "state", state = "hfxo" }, { role = "state", state = "saadc" }, { role = "state", state = "radio_tx" }, { role = "state", state = "radio_rx" }]
params = { ibase = "2.35uA", pscale = "0", vnom = "3V" }
rails = ["VDD"]

[analog.provenance]
source = "datasheet"
refs = [
  "nRF52840 PS v1.1 section 5.2 (current consumption scenarios at 3 V, 25 degC): the LDO (the default mode) ICPU1, ITIMER0, ITIMER2, IRADIO_TX3, IRADIO_RX1; the DC/DC ICPU0, ICPU4, ISAADC,RUN, IRADIO_TX1, IRADIO_RX0; ION_RAMON_EVENT",
  "nRF52840 PS v1.1 section 5.3.8.1: VDD minimum 1.7 V (normal voltage mode operating voltage)",
]
deviations = [
  "the states' scenario currents are summed; each PS figure includes its own clock and regulator base, so concurrent states count them twice (at most HFXO's 0.2 mA)",
  "below vdd_min the current falls linearly to 0 at 0 V (a conductance at every operating point, ADR-009 D2 rule 2); the PS does not specify the SoC below 1.7 V",
  "constant current over VDD (the PS's 3 V figures) unless pscale = 1 (constant power), which is not verified",
  "on the LDO, run is ICPU1 less the LDO's HFXO difference (ITIMER2 - ITIMER0), since the PS gives no LDO figure on HFINT; the SAADC's LDO current is its DC/DC figure (the PS gives none)",
