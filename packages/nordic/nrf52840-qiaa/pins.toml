# nordic/nrf52840-qiaa pins (aQFN73, QIAA): ball numbers as KiCad 10.0.8's MCU_Nordic:nRF52840 gives
# them (73 balls and the exposed pad EP), checked with `scripts/check_pins_kicad.py --composite`.
# A GPIO is named by its port name (P0.02), the name a binding uses (ADR-008 D2); KiCad's composite
# names ("AIN0/P0.02", "P0.18/~{RESET}") keep their other functions in `alt` (ADR-006 Amendment 3).
#
# Pin models (Phase 1 M5; ADR-006 D9 rule 2: the suite's conflicting GPIO numbers resolved against the
# PS). Every GPIO offers digital_out and digital_in; the eight AIN pins also offer adc_in, Breadboard's
# SAADC (plan M8, ADR-008 D7; set below). The output stage is the Thevenin form of spec/pin-model.md: a pad drives VDD or 0 V
# through zout = 0.4 V / I, where I is nRF52840 PS v1.1 section 6.9.3.1's current at a 0.4 V drop
# (IOH/IOL; the source side is used for both edges, as the dial-me-spinner suite does). The named sets
# are the PIN_CNF DRIVE values the firmware may use and the PS's min/typ/max columns:
#
#   set         DRIVE   PS column                         zout       suite file that uses it
#   S0S1        S0S1    IOH,SD typ 2 mA                   200 Ohm    load_switches__nrf52840_gpio.lib default
#   S0S1_min    S0S1    IOH,SD min 1 mA (weakest pad)     400 Ohm    load_switches (ROUT sd_min)
#   S0S1_max    S0S1    IOH,SD max 4 mA (strongest pad)   100 Ohm    load_switches (ROUT sd_max)
#   S0S1_bound  S0S1    VOH,SD >= VDD - 0.4 V at 0.5 mA   800 Ohm    motor_drive__ and sleep_current__ (the
#                                                                    guaranteed bound for uA-level loads)
#   H0H1        H0H1    IOH,HDH typ 9 mA                  44.4444    load_switches (ROUT hd_typ; LED_PWR_EN)
#   H0H1_min    H0H1    IOH,HDH min 6 mA                  66.6667    load_switches (ROUT hd_min)
#   H0H1_max    H0H1    IOH,HDH max 14 mA (strongest)     28.5714    load_switches (ROUT hd_max; P0.06 in E1)
#   default     S0S1    = S0S1 (the PIN_CNF reset value of DRIVE)
#
# zout values are the suite's own numbers (0.4 V / I to 6 significant digits). rise/fall: the PS
# dynamic table's typical 10-90 % times at 25 pF (tRF 13 ns standard, tHRF 5 ns high drive; "based on
# simulations"). The 200 Ohm against 800 Ohm "conflict" of ADR-006 Context 1 is two PS figures for two
# purposes (a current at 0.4 V drop, and the VOH guarantee at 0.5 mA), so both are kept, by name.
# digital_in: VIH 0.7 VDD, VIL 0.3 VDD (PS 6.9.3.1), CIN = CPAD 3 pF (PS pad capacitance).
# NOT modelled at the pin: the ESD clamps and the I-V beyond the 0.4 V point (the suite's tanh fit);
# the internal pull resistors; drive-strength changes at run time (the binding's set is fixed, ADR-008 D4
# audits PIN_CNF against it).
# UARTE (ADR-008 D8): the UARTE PSEL.TXD/RXD pin selects are placeholders in Renode, so a UART gives no
# pin edge on its TX or RX pin (nothing to bind); its output reaches events.jsonl only as the
# `uart<n>: <line>` log records of D8.
schema = "bb-pins/0"

