cin = "3p"

# adc_in (Phase 1 M8, ADR-008 D7): Breadboard's SAADC. vref is the clamp of the pushed value (the
# pad cannot exceed VDD: spec/pin-model.md's vmax); bits documents the 12-bit code E2 reads (the
# SAADC's resolution is the firmware's choice); the loading view saadc_se (part.toml) is on by
# default, load = "none" on a binding makes the input ideal (run.json records it).
# A loaded input needs TACQ >= 2 L (L = --renode-quantum, ADR-008 D7): bb run refuses an acquisition
# with a shorter TACQ and fails the run. Zephyr's default TACQ (10 us) at L = 10 us is refused; the
# remedies are --renode-quantum <TACQ/2> (e.g. 5us for 10 us, 1us for 3 us) or load = "none".
[defaults.adc_in.default]
vref = "VDD"
bits = "12"
model = "nrf_saadc"
load = "saadc_se"
