  "CJ B5817W-5819W, rev D (March 2015), page 1: VF <= 0.6 V at 1 A, <= 0.9 V at 3 A; V(BR) >= 40 V at 1 mA; IR <= 1 mA at 40 V; CD <= 120 pF at 4 V, 1 MHz",
  "page 2, Forward Characteristics (25 C, read): 0.1 A at about 0.32 V, 1 A at about 0.43 V",
  "page 2, Capacitance Characteristics (25 C, read): 180 pF at 0 V, about 60 pF at 4 V, 40 pF at 10 V",
]
deviations = ["n 1.1 and rs 0.05 Ohm fit the curve up to 1 A only"]
