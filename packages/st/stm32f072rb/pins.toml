# KiCad 10.0.8's MCU_ST_STM32F0:STM32F072RBTx give them (checked with
# scripts/check_pins_kicad.py). ADC_IN0-7 are PA0-PA7, ADC_IN8-9 PB0-PB1,
# ADC_IN10-15 PC0-PC5 (RM0091), the channels Breadboard's ADC model reads.

