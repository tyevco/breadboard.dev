# st/stm32f103c8 pins (LQFP48): numbers and names as DS5319 Table 5 and
# KiCad 10.0.8's MCU_ST_STM32F1:STM32F103C8Tx give them (checked with
# scripts/check_pins_kicad.py). Renode's STM32F103 has no ADC model in
# Breadboard (ADR-003 Context fact 8), so no pin offers adc_in.

schema = "bb-pins/0"

[[pin]]
