# Parameter sets (ADR-006 D4). `default` carries the pin models Phase 0's
# board.cir files state for this MCU (ADR-006 D10): estimated, not datasheet
# values (part.toml [provenance]).
[defaults.digital_out.default]
voh = "3.3V"
vol = "0V"
rise = "5ns"
fall = "5ns"
zout = "25"

[defaults.digital_in.default]
vih = "2.0V"
vil = "0.8V"
cin = "5pF"
