# ti/tps22917: TI TPS22917 load switch (Phase 1 plan M5b, ADR-006 D9 rule 4 and Amendment 3).
#
# The committed default view `lsw` is DATASHEET-FITTED (breadboard.dev's own behavioural model from
# SLVSDW8B's tables). The dial-me-spinner suite's view is derived from TI's SLVMCE8 PSpice model, whose
# redistribution terms were not checked, so it is LOCAL-ONLY (approver decision A3): `make
# dms-local-packages` builds it as a package with the same id, view name, ports and parameters in the
# git-ignored local-packages/ (a project that lists that path shadows this package), and `make dms-m5b`
# gates this view against it on the E1 checks (10 mV / 1 ms).
schema = "bb-part/0"

[part]
id = "ti/tps22917"
version = "0.1.0"
kind = "power"
manufacturer = "Texas Instruments"
mpn = ["TPS22917DBVR", "TPS22917DBVT"]
lcsc = ["C2681320"]
datasheet = { url = "https://www.ti.com/lit/ds/symlink/tps22917.pdf", rev = "SLVSDW8B" }
license = "Apache-2.0"
description = "1-5.5 V, 2 A load switch, adjustable rise time, quick output discharge"

[footprints]
kicad = ["Package_TO_SOT_SMD:SOT-23-6"]

[pins]
file = "pins.toml"

[[analog]]
name = "lsw"
purpose = "rail switching: ON comparator, CT-set turn-on ramp (Table 7.6), RON, quick output discharge"
fidelity = ["fast"]
default_for = ["fast"]
file = "analog/lsw_fit.lib"
subckt = "TPS22917_LSW_FIT"
ports = ["CT", "GND", "ON", "QOD", "VIN", "VOUT"]
params = { ron_add = "0", isd_out = "0" }

[analog.provenance]
source = "datasheet"
base = "breadboard.dev's own behavioural model (no vendor netlist): SLVSDW8B Tables 7.3, 7.5 and 7.6"
refs = ["SLVSDW8B Table 7.3 (VIH, VIL)", "SLVSDW8B Table 7.5 (RON typ, QOD typ, RPD)", "SLVSDW8B Table 7.6 (tON, tR, SRON, CT open)"]
deviations = [
  "a linear turn-on ramp through Table 7.6's tON and tR, so its slope is about 5 % below Table 7.6's SRON",
  "ON trip points 0.68 V rising / 0.63 V falling: the datasheet guarantees only VIL <= 0.35 V and VIH >= 1.0 V",
  "IQ 0.5 uA on, ISD 5 nA off: assumed values inside Figures 7-1/7-2's ranges",
]
not_modelled = ["temperature (ron_add and isd_out apply Table 7.5 corners)", "RON below 3.6 V except by linear extrapolation (clamped at 0.25 Ohm)", "QOD's dependence on VIN", "reverse current blocking thresholds and timing (reverse current is never conducted)", "thermal shutdown", "ESD structures", "tolerance and part-to-part spread"]
generated_by = "Claude (Phase 1 M5b)"
confidence = "datasheet_checked"

[[analog.qualified]]   # bb pkg test --record
lattice = "10us"
options = "phase0"

[tests]
dir = "tests"
