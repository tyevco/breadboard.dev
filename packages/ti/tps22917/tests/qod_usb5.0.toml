# U2 quick output discharge of VLED on the main board, corner usb5.0: the suite's test_u2_qod_discharge[usb5.0]
# deck (u2_turn_off). LED_PWR_EN (GPIO control node n_ctl_led) high at 0.1 ms, low at 5 ms.
# The crossing levels are 10 % and 90 % of vled0 = 4.485772 V, VLED at 0.99 t_off in the suite's own
# run of this deck (as the suite measures it).
# Generated by breadboard.dev scripts/dms_packages.py (make dms-vectors); do not edit.
schema = "bb-pkgtest/0"
view = "lsw"
circuit = "qod_usb5.0.cir"
stop = "50ms"

[ports]
CT = "n_lsw_ct"
GND = "0"
ON = "n_led_pwr_en"
QOD = "n_lsw_qod"
VIN = "n_vsys"
VOUT = "n_vled"

[[edge]]
net = "n_ctl_led"
model = { voh = "1V", vol = "0V", rise = "100ns", fall = "100ns", zout = "1" }
at = [["0.1ms", "high"], ["5ms", "low"]]

[[expect]]
meas = { node = "n_vled", when = "0.448577V", fall = "1", after = "5ms" }
value = "28.866197ms"
tol = "1ms"
source = "examples/dial-me-spinner/suite/results.json (M0, 6854d25): test_u2_qod_discharge[usb5.0] 5 ms + t_off10 (0.0238661973 s); the vendor-derived view's value, so the stated tolerance is the datasheet-fitted view's distance to it (ADR-006 Amendment 3)"

[[expect]]
meas = { node = "n_vled", when = "4.037195V", fall = "1", after = "5ms" }
