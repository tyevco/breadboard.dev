# dms/detent-mechanism: the dial-me-spinner detent mechanism and its home switch as one
# behavioural device (Phase 1 M10; ADR-006 D7 and Amendment 6, ADR-008 Amendment 9).
#
# The micro linear stepper's rotor, the lead screw and carriage, the detent magnet's field at U42
# and the DRV5032FA itself are one `bbdev` device, `dms/mechanism@1` (bbdev/src/dms_mechanism.rs),
# because the switch's input is the magnet's field: internal state, not a net. It reads the two
# DRV8837s' commands (IN1/IN2 of U40 and U41, and the shared nSLEEP) and drives HOME_N. The bridge
# and the coils' electrical side are the analog view of ti/drv8837 in ngspice. A board file names
# it with `*bb part M1 package=dms/detent-mechanism` and binds its pins (spec/package.md section
# 12); its parameters (ts, die, s0, ...) go on that line. It is not on the schematic, so an
# imported project cannot hold it yet (route B, a Phase 2 item: approver decision 2, 2026-11-14).
