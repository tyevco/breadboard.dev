# raytac/mdbt50q-u1mv2 pads: numbers and names as the dial-me-spinner project library gives them
# (dial_spinner:MDBT50Q-U1MV2_byport, vendored at examples/dial-me-spinner/kicad/main/lib/, the symbol a
# netlist of the reference board carries; checked with scripts/check_pins_kicad.py). Raytac's own pad
# table was not checked offline: the board's footprint dial_spinner:Raytac_MDBT50Q_UFL decides the pads.
#
# A module's pads carry no parameter sets of their own: a binding on a module pad takes its pin model's
# parameters from the chip pin that module-pinmap.csv maps the pad to (nordic/nrf52840-qiaa's pins.toml),
# and a supply reference (voh = "VDD") names a chip pin, which the pinmap leads back to a module pad and
# its net (spec/package.md section 4, ADR-006 Amendment 3). The models a pad offers are listed here so
# a binding is checked against the module's own pins (bb run refuses a model the pad does not list). The
# eight AIN pads offer adc_in, the chip's SAADC, with the chip pin's channel (ADR-008 D7, Phase 1 M8).
schema = "bb-pins/0"

[[pin]]
number = "1"
name = "GND"
role = "ground"

